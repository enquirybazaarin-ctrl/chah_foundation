name: CHAH Foundation CI/CD Deploy
# Automated Deployment to Hostinger via High-Speed FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Auto-Deploy All Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            website/package-lock.json
            admin/package-lock.json

      # 1. Build Backend
      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
        env:
          DATABASE_URL: "mysql://root:test@localhost:3306/chah_test"
          JWT_SECRET: "mock_jwt_secret_must_be_32_characters_long_for_test"
          ADMIN_CORS_ORIGIN: "https://admin.chahfoundation.com"
          FRONTEND_URL: "https://chahfoundation.com"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "placeholder"
          RAZORPAY_WEBHOOK_SECRET: "placeholder"

      # 2. Build Website (Frontend)
      - name: Install & Build Website
        run: |
          cd website
          npm ci
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
        env:
          NEXT_PUBLIC_API_URL: "https://api.chahfoundation.com"

      # 3. Build Admin Portal
      - name: Install & Build Admin
        run: |
          cd admin
          npm ci
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
        env:
          NEXT_PUBLIC_API_URL: "https://api.chahfoundation.com"

      # 4. Install Deploy Dependencies
      - name: Setup Deployer
        run: npm install --no-save basic-ftp

      # 5. Deploy Website to new.chahfoundation.com via FTPS
      - name: Deploy Website (new.chahfoundation.com)
        run: node scripts/deploy.js --app=website
        env:
          HOSTINGER_FTP_HOST: "145.79.58.42"
          HOSTINGER_FTP_PORT: "21"
          HOSTINGER_FTP_USER: "u605717783"
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}

      # 6. Deploy Admin to admin.chahfoundation.com via FTPS
      - name: Deploy Admin (admin.chahfoundation.com)
        run: node scripts/deploy.js --app=admin
        env:
          HOSTINGER_FTP_HOST: "145.79.58.42"
          HOSTINGER_FTP_PORT: "21"
          HOSTINGER_FTP_USER: "u605717783"
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}

      # 7. Deploy Backend to api.chahfoundation.com via FTPS
      - name: Deploy Backend (api.chahfoundation.com)
        run: node scripts/deploy.js --app=backend
        env:
          HOSTINGER_FTP_HOST: "145.79.58.42"
          HOSTINGER_FTP_PORT: "21"
          HOSTINGER_FTP_USER: "u605717783"
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}
