name: CHAH Foundation CI/CD Deploy
# Automated Deployment to Hostinger via High-Speed FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Auto-Deploy All Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            website/package-lock.json
            admin/package-lock.json

      # 1. Build Backend
      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
        env:
          DATABASE_URL: "mysql://root:test@localhost:3306/chah_test"
          JWT_SECRET: "mock_jwt_secret_must_be_32_characters_long_for_test"
          ADMIN_CORS_ORIGIN: "https://admin.chahfoundation.com"
          FRONTEND_URL: "https://chahfoundation.com"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "placeholder"
          RAZORPAY_WEBHOOK_SECRET: "placeholder"

      # 2. Build Website (Frontend)
      - name: Install & Build Website
        run: |
          cd website
          npm ci
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
        env:
          NEXT_PUBLIC_API_URL: "https://api.chahfoundation.com"

      # 3. Build Admin Portal
      - name: Install & Build Admin
        run: |
          cd admin
          npm ci
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
        env:
          NEXT_PUBLIC_API_URL: "https://api.chahfoundation.com"

      # 4. Deploy Website to new.chahfoundation.com via FTP
      - name: Deploy Website to new.chahfoundation.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.58.42
          username: u605717783
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}
          local-dir: ./website/
          server-dir: ./domains/new.chahfoundation.com/hbuilds/current/nodejs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/.env*/**

      # 5. Deploy Admin to admin.chahfoundation.com via FTP
      - name: Deploy Admin to admin.chahfoundation.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.58.42
          username: u605717783
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}
          local-dir: ./admin/
          server-dir: ./domains/admin.chahfoundation.com/hbuilds/current/nodejs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/.env*/**

      # 6. Deploy Backend to api.chahfoundation.com via FTP
      - name: Deploy Backend to api.chahfoundation.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.58.42
          username: u605717783
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_SSH_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./domains/api.chahfoundation.com/hbuilds/current/nodejs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/.env*/**
            **/uploads/**
