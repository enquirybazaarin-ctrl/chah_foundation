name: CHAH Foundation CI/CD Deploy
# Auto-deployment to Hostinger (Websites, Admin, Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate All Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            website/package-lock.json
            admin/package-lock.json

      # 1. Build Backend
      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: "mysql://root:test@localhost:3306/chah_test"
          JWT_SECRET: "mock_jwt_secret_must_be_32_characters_long_for_test"
          ADMIN_CORS_ORIGIN: "https://admin.chahfoundation.com"
          FRONTEND_URL: "https://chahfoundation.com"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "placeholder"
          RAZORPAY_WEBHOOK_SECRET: "placeholder"

      # 2. Build Website (Frontend)
      - name: Install & Build Website
        run: |
          cd website
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.chahfoundation.com"

      # 3. Build Admin Portal
      - name: Install & Build Admin
        run: |
          cd admin
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.chahfoundation.com"

  deploy-to-hostinger:
    name: Deploy to Hostinger via Native SSH
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deploy on Hostinger
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          if [ -z "$HOSTINGER_SSH_HOST" ]; then
            echo "HOSTINGER_SSH_HOST is not set. Skipping deploy."
            exit 0
          fi

          echo "📦 Installing sshpass..."
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          echo "🚀 Connecting to Hostinger via Native OpenSSH on port 65002..."
          chmod +x scripts/deploy_hostinger.sh
          sshpass -p "$HOSTINGER_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -p 65002 "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" "bash -s" < scripts/deploy_hostinger.sh
